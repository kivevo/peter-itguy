<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1726"/>
      <stop offset="60%" stop-color="#16263D"/>
      <stop offset="100%" stop-color="#09101A"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2FA39A"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#2FA39A" stroke-opacity="0.08" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="1050" cy="150" r="280" fill="#2FA39A" opacity="0.12" filter="blur(60px)" />
  <circle cx="150" cy="500" r="220" fill="#38BDF8" opacity="0.08" filter="blur(60px)" />

  <!-- Hexagon Brand Mark Logo -->
  <g transform="translate(100, 100)">
    <polygon points="60,6 110,32 110,88 60,114 10,88 10,32" fill="#16263D" stroke="#2FA39A" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="60" cy="28" r="4.5" fill="#2FA39A" />
    <line x1="60" y1="33" x2="60" y2="46" stroke="#2FA39A" stroke-width="3" stroke-linecap="round" />
    <text x="60" y="84" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">P</text>
  </g>

  <!-- Brand Pill -->
  <g transform="translate(250, 125)">
    <rect x="0" y="0" width="340" height="42" rx="21" fill="#2FA39A" fill-opacity="0.15" stroke="#2FA39A" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="24" cy="21" r="5" fill="#2FA39A" />
    <text x="42" y="27" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#2FA39A" letter-spacing="1.5">ON-CALL IT PARTNER · NAIROBI</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="290" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Peter Kivevo John
  </text>
  <text x="100" y="360" font-family="'Space Grotesk', system-ui, sans-serif" font-size="48" font-weight="700" fill="url(#tealGrad)">
    The IT Guy — Support, Networks &amp; Web
  </text>

  <!-- Value Points Strip -->
  <g transform="translate(100, 430)">
    <!-- Point 1 -->
    <rect x="0" y="0" width="300" height="60" rx="14" fill="#16263D" stroke="#2FA39A" stroke-width="1" stroke-opacity="0.3"/>
    <text x="20" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">✓ 30+ Samchi Branches</text>

    <!-- Point 2 -->
    <rect x="330" y="0" width="300" height="60" rx="14" fill="#16263D" stroke="#2FA39A" stroke-width="1" stroke-opacity="0.3"/>
    <text x="350" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">✓ 40% Faster Load Speed</text>

    <!-- Point 3 -->
    <rect x="660" y="0" width="300" height="60" rx="14" fill="#16263D" stroke="#2FA39A" stroke-width="1" stroke-opacity="0.3"/>
    <text x="680" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">✓ BSc Computer Science</text>
  </g>

  <!-- Footer Contact Line -->
  <text x="100" y="550" font-family="'Courier New', monospace" font-size="18" font-weight="600" fill="#94A3B8">
    WhatsApp: +254 758 896 553  •  Location: Nairobi GPO 00100, Kenya  •  peterkivevo.com
  </text>
</svg>
